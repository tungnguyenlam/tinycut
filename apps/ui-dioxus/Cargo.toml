[package]
name = "tinycut-ui-dioxus"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
dioxus = { version = "0.6", features = ["web"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
tinycut-core-domain = { path = "../../crates/core-domain", default-features = false }
uuid = { version = "1", features = ["v4", "js", "serde"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
