[workspace]
resolver = "2"
members = [
    "crates/core-domain",
    "crates/model-hub",
    "crates/media-engine",
    "crates/ai-audio",
    "crates/vision-shield",
    "crates/gpu-compositor",
    "crates/export-engine",
    "crates/local-store",
    "crates/sync-client",
]
# Native Tauri shell requires OS WebView headers; build it with `cargo tauri`
# and the TypeScript frontend in `apps/ui-web` with `pnpm`.
exclude = [
    "apps/ui-shell/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
